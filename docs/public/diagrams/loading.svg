<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 746" role="img" aria-labelledby="title desc"><title id="title">読み込みから次のシーンへ</title><desc id="desc">登録・実行・反映の担当を分ける。メイン：タスクを登録：LoadingScene → 次シーンの構築 → AddTask。メイン：実行開始：全タスクの登録後に Run。ワーカー：段階ごとに実行：DATA → INIT → GRAPH → SOUND → FINAL。ワーカー：反映を予約：PostToMain：共有状態への変更をメインへ渡す。メイン：結果を反映：毎フレーム PumpMain → 完了・失敗を判定。成功した場合：次シーンを初期化：次シーン.Init → プレイ開始</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#337e72"/></marker></defs><rect width="640" height="746" rx="12" fill="#fff"/><g font-family="'Yu Gothic',sans-serif" fill="#233e38"><text x="24" y="38" font-size="25" font-weight="700">読み込みから次のシーンへ</text><text x="24" y="68" font-size="16">登録・実行・反映の担当を分ける</text><rect x="20" y="96" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="125" font-size="20" font-weight="700">メイン：タスクを登録</text><text x="40" y="152" font-size="16">LoadingScene → 次シーンの構築 → AddTask</text>
<path d="M320 175v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="229" font-size="20" font-weight="700">メイン：実行開始</text><text x="40" y="256" font-size="16">全タスクの登録後に Run</text>
<path d="M320 279v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="304" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="333" font-size="20" font-weight="700">ワーカー：段階ごとに実行</text><text x="40" y="360" font-size="16">DATA → INIT → GRAPH → SOUND → FINAL</text>
<path d="M320 383v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="408" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="437" font-size="20" font-weight="700">ワーカー：反映を予約</text><text x="40" y="464" font-size="16">PostToMain：共有状態への変更をメインへ渡す</text>
<path d="M320 487v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="512" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="541" font-size="20" font-weight="700">メイン：結果を反映</text><text x="40" y="568" font-size="16">毎フレーム PumpMain → 完了・失敗を判定</text>
<path d="M320 591v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="616" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="645" font-size="20" font-weight="700">成功した場合：次シーンを初期化</text><text x="40" y="672" font-size="16">次シーン.Init → プレイ開始</text></g></svg>
