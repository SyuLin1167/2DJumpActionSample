<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 642" role="img" aria-labelledby="title desc"><title id="title">1フレームの流れ</title><desc id="desc">上から順に処理し、次のフレームへ進む。01 入力と時間：SceneManager：キー・マウス・フレーム時間を更新。02 オブジェクトの更新：Component → GameObject.Update：移動量を決める。03 衝突と移動：ColliderManager.Step：判定・押し戻し・接触処理。04 結果を反映：LateUpdate → カメラ更新 → 追加・削除の反映。05 描画とシーン切り替え：描画 → フレーム終端でシーンコマンドを適用</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#337e72"/></marker></defs><rect width="640" height="642" rx="12" fill="#fff"/><g font-family="'Yu Gothic',sans-serif" fill="#233e38"><text x="24" y="38" font-size="25" font-weight="700">1フレームの流れ</text><text x="24" y="68" font-size="16">上から順に処理し、次のフレームへ進む</text><rect x="20" y="96" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="125" font-size="20" font-weight="700">01 入力と時間</text><text x="40" y="152" font-size="16">SceneManager：キー・マウス・フレーム時間を更新</text>
<path d="M320 175v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="229" font-size="20" font-weight="700">02 オブジェクトの更新</text><text x="40" y="256" font-size="16">Component → GameObject.Update：移動量を決める</text>
<path d="M320 279v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="304" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="333" font-size="20" font-weight="700">03 衝突と移動</text><text x="40" y="360" font-size="16">ColliderManager.Step：判定・押し戻し・接触処理</text>
<path d="M320 383v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="408" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="437" font-size="20" font-weight="700">04 結果を反映</text><text x="40" y="464" font-size="16">LateUpdate → カメラ更新 → 追加・削除の反映</text>
<path d="M320 487v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="512" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="541" font-size="20" font-weight="700">05 描画とシーン切り替え</text><text x="40" y="568" font-size="16">描画 → フレーム終端でシーンコマンドを適用</text></g></svg>
