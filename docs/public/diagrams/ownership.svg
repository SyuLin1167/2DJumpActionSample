<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 538" role="img" aria-labelledby="title desc"><title id="title">シーン内の所有関係</title><desc id="desc">矢印は所有を表す。処理順ではない。SceneManager：shared_ptr で SceneBase を保持。SceneBase：unique_ptr で ObjectManager を所有。ObjectManager：shared_ptr で GameObject を保持。GameObject / ComponentManager：shared_ptr で各 Component を保持</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#337e72"/></marker></defs><rect width="640" height="538" rx="12" fill="#fff"/><g font-family="'Yu Gothic',sans-serif" fill="#233e38"><text x="24" y="38" font-size="25" font-weight="700">シーン内の所有関係</text><text x="24" y="68" font-size="16">矢印は所有を表す。処理順ではない</text><rect x="20" y="96" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="125" font-size="20" font-weight="700">SceneManager</text><text x="40" y="152" font-size="16">shared_ptr で SceneBase を保持</text>
<path d="M320 175v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="229" font-size="20" font-weight="700">SceneBase</text><text x="40" y="256" font-size="16">unique_ptr で ObjectManager を所有</text>
<path d="M320 279v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="304" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="333" font-size="20" font-weight="700">ObjectManager</text><text x="40" y="360" font-size="16">shared_ptr で GameObject を保持</text>
<path d="M320 383v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="408" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="437" font-size="20" font-weight="700">GameObject / ComponentManager</text><text x="40" y="464" font-size="16">shared_ptr で各 Component を保持</text></g></svg>
