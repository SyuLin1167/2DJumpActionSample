<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 538" role="img" aria-labelledby="title desc"><title id="title">矩形と円の衝突：呼び出しの流れ</title><desc id="desc">発行側と相手側、2つの型で処理を選ぶ。01 ColliderManager.Step：矩形を発行側、円を相手として組合せを処理。02 RectCollider.CollideWith：自分が持つ RectColliderVisitor を相手へ渡す。03 CircleCollider.Accept：具体的な円の型で Visitor.Visit を呼ぶ。04 RectColliderVisitor.Visit(CircleCollider&amp;)：矩形 × 円に対応する判定・解決処理へ進む</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#337e72"/></marker></defs><rect width="640" height="538" rx="12" fill="#fff"/><g font-family="'Yu Gothic',sans-serif" fill="#233e38"><text x="24" y="38" font-size="25" font-weight="700">矩形と円の衝突：呼び出しの流れ</text><text x="24" y="68" font-size="16">発行側と相手側、2つの型で処理を選ぶ</text><rect x="20" y="96" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="125" font-size="20" font-weight="700">01 ColliderManager.Step</text><text x="40" y="152" font-size="16">矩形を発行側、円を相手として組合せを処理</text>
<path d="M320 175v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="229" font-size="20" font-weight="700">02 RectCollider.CollideWith</text><text x="40" y="256" font-size="16">自分が持つ RectColliderVisitor を相手へ渡す</text>
<path d="M320 279v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="304" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="333" font-size="20" font-weight="700">03 CircleCollider.Accept</text><text x="40" y="360" font-size="16">具体的な円の型で Visitor.Visit を呼ぶ</text>
<path d="M320 383v20" stroke="#337e72" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="408" width="600" height="78" rx="10" fill="#edf5f2" stroke="#91b7ad"/><text x="40" y="437" font-size="20" font-weight="700">04 RectColliderVisitor.Visit(CircleCollider&amp;)</text><text x="40" y="464" font-size="16">矩形 × 円に対応する判定・解決処理へ進む</text></g></svg>
