name: Check documentation
on:
  pull_request:
    paths: ['README.md', 'docs/**', 'ProjectName/code/**', 'ProjectName/include/MyLib/**', 'ProjectName/project/project.vcxproj', 'setup.bat', '.github/workflows/docs-*.yml']
  push:
    branches: [develop-dxlib]
    paths: ['README.md', 'docs/**', 'ProjectName/code/**', 'ProjectName/include/MyLib/**', 'ProjectName/project/project.vcxproj', 'setup.bat', '.github/workflows/docs-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
